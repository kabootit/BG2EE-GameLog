<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BG2EE game log — events</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<h1>BG2EE game log <span id="subtitle"></span></h1>

<nav class="tabs" aria-label="view">
  <a class="tab" data-path="/events" href="/events" aria-current="page">events</a>
  <a class="tab" data-path="/combatants" href="/combatants">combatants</a>
</nav>

<div class="controls">
  <label>session <select id="session"><option value="">all</option></select></label>
  <label>kind <select id="kind"><option value="">all</option></select></label>
  <label>group by <select id="groupby">
    <option value="">none (events)</option>
    <option value="actor">actor</option>
    <option value="target">target</option>
    <option value="kind">kind</option>
    <option value="detail">detail</option>
    <option value="spell">spell</option>
    <option value="summon">summon</option>
    <option value="target_summon">target summon</option>
    <option value="actor_side">actor side</option>
    <option value="target_side">target side</option>
    <option value="screen">screen</option>
    <option value="session">session</option>
  </select></label>
  <input type="search" id="q" placeholder="search text, actor, target">
  <div class="spacer"></div>
  <label><input type="checkbox" id="battle" checked> battle only</label>
  <label><input type="checkbox" id="auto"> auto-refresh</label>
  <button id="clearsort" disabled>clear sort</button>
  <button id="refresh">refresh</button>
</div>

<div class="status" id="status"></div>
<div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>

<!-- type="module" is required: this script uses top-level await, which is a
     syntax error in a classic script and silently prevents the whole block from
     parsing, leaving the page rendered but completely inert. -->
<script type="module">
import { $, esc, fillSelect, initShell, setStatus } from "/common.js";

/** Sort keys, most significant first. Click a header to add, cycle, then drop it. */
const state = { sort: [], offset: 0, limit: 500 };
const MAX_SORT_KEYS = 4;

const EVENT_COLUMNS = [
  { key: "id",         label: "#",      num: true },
  { key: "game_time",  label: "in-game", verbose: true },
  { key: "game_ticks", label: "ticks",  num: true, verbose: true },
  { key: "kind",       label: "kind" },
  { key: "actor_side", label: "side" },
  // Summoned creatures get their own column, so the actor column stays the party
  // roster and the opposition. The name lives in exactly one of the two.
  { key: "actor",      label: "actor",  hideWhen: (r) => r.summon !== null },
  { key: "summon",     label: "summon" },
  { key: "target",     label: "target", hideWhen: (r) => r.target_summon !== null,
    kinds: ["attack", "damage", "effect", "spell"] },
  { key: "target_summon", label: "tgt summon", kinds: ["attack", "damage", "effect", "spell"] },
  { key: "detail",     label: "detail" },
  { key: "amount",     label: "amount", num: true,
    kinds: ["damage", "save", "xp", "gold", "loot", "level"] },
  { key: "roll",       label: "roll",   num: true, kinds: ["attack", "tohit", "damageroll"] },
  { key: "resisted",   label: "resisted", num: true, kinds: ["damage"] },
  { key: "critical",   label: "crit",   flag: true, kinds: ["damage"] },
  { key: "spell",      label: "spell",  kinds: ["damage"] },
  { key: "raw",        label: "text",   raw: true },
];

const GROUP_COLUMNS = [
  { key: "key",    label: "value" },
  { key: "events", label: "events", num: true },
  { key: "damage", label: "damage", num: true },
  { key: "resisted", label: "resisted", num: true },
  { key: "xp",     label: "xp",     num: true },
  { key: "crits",  label: "crits",  num: true },
  { key: "crit_damage", label: "crit dmg", num: true },
];

/**
 * Kinds hidden by default: narration and bookkeeping, plus the per-swing roll
 * breakdowns, which are two extra rows per attack and drown the timeline.
 * Still reachable by selecting the kind explicitly.
 */
const HIDDEN_KINDS = ["pause", "dialogue", "other", "tohit", "damageroll"];

function params() {
  const p = new URLSearchParams();
  for (const id of ["session", "kind", "q"]) {
    if ($(id).value) p.set(id, $(id).value);
  }
  if ($("battle").checked) p.set("exclude", HIDDEN_KINDS.join(","));
  return p;
}

/**
 * Columns worth showing right now. Two independent narrowings:
 *  - "battle only" drops the timing columns, which are for correlating against
 *    the raw log rather than reading a fight
 *  - selecting a single kind drops columns that kind never populates. The `kinds`
 *    lists come from what the data actually sets, not from guesswork.
 */
function visibleColumns() {
  const kind = $("kind").value;
  const battle = $("battle").checked;
  return EVENT_COLUMNS.filter((c) =>
    !(c.verbose && battle) && !(kind && c.kinds && !c.kinds.includes(kind))
  );
}

const sortIndex = (key) => state.sort.findIndex((s) => s.key === key);

function renderHead(columns, sortable) {
  $("head").innerHTML = "<tr>" + columns.map((c) => {
    let mark = "";
    if (sortable) {
      const i = sortIndex(c.key);
      if (i !== -1) {
        const arrow = state.sort[i].dir === "asc" ? "↑" : "↓";
        // Rank only matters once there is a chain; a lone "1" is just noise.
        mark = ` <span class="sortmark">${arrow}${state.sort.length > 1 ? i + 1 : ""}</span>`;
      }
    }
    const attr = sortable ? ` data-sort="${c.key}"` : "";
    return `<th${attr}>${c.label}${mark}</th>`;
  }).join("") + "</tr>";

  $("clearsort").disabled = state.sort.length === 0;
  if (!sortable) return;

  for (const th of $("head").querySelectorAll("th[data-sort]")) {
    th.onclick = () => {
      const key = th.dataset.sort;
      const i = sortIndex(key);
      if (i === -1) {
        // New keys join as least significant. When the chain is full the last
        // one gives way, so the primary sort is never disturbed by a stray click.
        if (state.sort.length >= MAX_SORT_KEYS) state.sort.pop();
        state.sort.push({ key, dir: "asc" });
      } else if (state.sort[i].dir === "asc") {
        state.sort[i].dir = "desc";
      } else {
        state.sort.splice(i, 1); // third click drops this key from the chain
      }
      state.offset = 0;
      load();
    };
  }
}

function cell(column, row) {
  const value = row[column.key];
  // Boolean columns show only the true case; a column full of "no" is noise.
  // Checked before the empty test, since 0 is a real value that must stay blank.
  if (column.flag) return value ? '<td class="flag">yes</td>' : "<td></td>";
  if (column.hideWhen && column.hideWhen(row)) return "<td></td>";
  if (value === null || value === undefined || value === "") return "<td></td>";
  const text = esc(value);
  if (column.key === "kind") return `<td><span class="kind">${text}</span></td>`;
  if (column.num) return `<td class="num">${text}</td>`;
  if (column.raw) return `<td class="raw">${text}</td>`;
  return `<td>${text}</td>`;
}

function renderRows(columns, rows) {
  if (rows.length === 0) {
    $("body").innerHTML =
      `<tr><td class="empty" colspan="${columns.length}">no matching events</td></tr>`;
    return;
  }
  $("body").innerHTML = rows
    .map((row) => "<tr>" + columns.map((c) => cell(c, row)).join("") + "</tr>")
    .join("");
}

/** The kind facet is scoped by the other filters, so it reloads with the rows. */
async function loadKinds() {
  const data = await (await fetch("/api/facets?" + params())).json();
  fillSelect("kind", data.kinds, "all kinds");
}

async function load() {
  await loadKinds();
  const groupBy = $("groupby").value;
  const p = params();

  if (groupBy) {
    p.set("by", groupBy);
    const data = await (await fetch("/api/groups?" + p)).json();
    renderHead(GROUP_COLUMNS, false);
    renderRows(GROUP_COLUMNS, data.rows);
    setStatus(`${data.rows.length} groups by ${groupBy}`);
    return;
  }

  if (state.sort.length > 0) {
    p.set("sort", state.sort.map((s) => `${s.key}:${s.dir}`).join(","));
  }
  p.set("limit", state.limit);
  p.set("offset", state.offset);
  const data = await (await fetch("/api/events?" + p)).json();
  const columns = visibleColumns();
  renderHead(columns, true);
  renderRows(columns, data.rows);

  const from = data.total === 0 ? 0 : data.offset + 1;
  setStatus(`${from}–${data.offset + data.rows.length} of ${data.total}`);
}

let debounce = null;
$("q").oninput = () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    state.offset = 0;
    load();
  }, 200);
};

for (const id of ["kind", "groupby"]) {
  $(id).onchange = () => {
    state.offset = 0;
    load();
  };
}

$("battle").onchange = () => {
  // Turning the scope on while a now-hidden kind is selected would leave the two
  // controls contradicting each other and the table empty. Drop the selection.
  if ($("battle").checked) {
    if (HIDDEN_KINDS.includes($("kind").value)) $("kind").value = "";
    // A sort on a column about to disappear would keep applying with no header
    // left to see it on or click it off.
    const hidden = new Set(EVENT_COLUMNS.filter((c) => c.verbose).map((c) => c.key));
    state.sort = state.sort.filter((s) => !hidden.has(s.key));
  }
  state.offset = 0;
  load();
};

$("clearsort").onclick = () => {
  state.sort = [];
  state.offset = 0;
  load();
};

await initShell(load);
</script>
</body>
</html>
